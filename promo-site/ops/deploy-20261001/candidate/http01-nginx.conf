# Candidate standalone HTTP-01 nginx config; no listener started by this file.
worker_processes 1;
pid /run/teknetik-http01.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    server {
        listen 0.0.0.0:8088 default_server;
        server_name _;
        return 421;
    }
    server {
        listen 0.0.0.0:8088;
        server_name teknetik.co www.teknetik.co phone.teknetik.co;
        if ($http_host !~* "^(teknetik\.co|www\.teknetik\.co|phone\.teknetik\.co)(:[0-9]+)?$") { return 421; }
        location ^~ /.well-known/acme-challenge/ {
            if ($request_uri !~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+(?:\?.*)?$") { return 404; }
            limit_except GET { deny all; }
            root /var/lib/letsencrypt;
            default_type text/plain;
            disable_symlinks on;
            autoindex off;
            try_files $uri =404;
        }
        location / { return 308 https://teknetik.co$request_uri; }
    }
    server {
        listen 0.0.0.0:8088;
        server_name ashfall.teknetik.co;
        if ($http_host !~* "^ashfall\.teknetik\.co(:[0-9]+)?$") { return 421; }
        location ^~ /.well-known/acme-challenge/ {
            if ($request_uri !~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+(?:\?.*)?$") { return 404; }
            limit_except GET { deny all; }
            root /var/lib/letsencrypt;
            default_type text/plain;
            disable_symlinks on;
            autoindex off;
            try_files $uri =404;
        }
        location / { return 308 https://ashfall.teknetik.co$request_uri; }
    }
}
