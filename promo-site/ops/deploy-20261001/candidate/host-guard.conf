# Candidate only; applied inside the Kong proxy server before route selection.
# SNI denial is HTTP 421 after TLS; not handshake-level privacy.
if ($http_host !~* "^(teknetik\.co|www\.teknetik\.co|phone\.teknetik\.co|ashfall\.teknetik\.co)(:[0-9]+)?$") { return 421; }
if ($ssl_server_name !~* "^(teknetik\.co|www\.teknetik\.co|phone\.teknetik\.co|ashfall\.teknetik\.co)$") { return 421; }
if ($host != $ssl_server_name) { return 421; }
